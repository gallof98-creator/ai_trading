# Local stack. Secrets come from .env (copy .env.example) - never from this file.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: qat
      POSTGRES_USER: qat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qat -d qat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment: &backend_env
      QAT_DATABASE_URL: postgresql+psycopg://qat:${POSTGRES_PASSWORD}@postgres:5432/qat
      QAT_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(json.load(urllib.request.urlopen('http://localhost:8000/health'))['status']!='ok')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    env_file: .env
    environment: *backend_env
    command: celery -A app.core.tasks.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      api: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
